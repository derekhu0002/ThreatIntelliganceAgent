services:
  neo4j:
    image: neo4j:5
    ports:
      - "7498:7474"
      - "7698:7687"
    environment:
      NEO4J_AUTH: neo4j/11111111

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4096:4096"
      - "8124:4096"
    entrypoint: ["/usr/local/bin/start-opencode-with-warmup.sh"]
    command: ["serve", "--port", "4096", "--hostname", "0.0.0.0", "--print-logs", "--log-level", "DEBUG"]
    working_dir: /root/project_tia
    env_file:
      - ../.env
    environment:
      PYTHON_BIN: python3
      PYTHONPATH: /root/project_tia
      THREAT_INTEL_REPO_ROOT: /root/project_tia
      THREAT_INTEL_AI4X_BASE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./opencode_app:/root/project_tia
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,sys,urllib.request; req=urllib.request.Request('http://127.0.0.1:4096/agent', headers={'Accept':'application/json'}); resp=urllib.request.urlopen(req, timeout=5); payload=json.loads(resp.read().decode('utf-8')); sys.exit(0 if isinstance(payload, list) else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s